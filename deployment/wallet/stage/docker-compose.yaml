services:
  wallet:
    build:
      context: .
      dockerfile: ./deployment/wallet/stage/Dockerfile
    container_name: mini_wallet-wallet
    profiles:
      - wallet
      - stage
    expose:
      - "5002"
    environment:
      ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${APP_LOG_LEVEL:-debug}
      GIN_MODE: ${APP_GIN_MODE:-release}
    networks:
      - docker_wallet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  docker_wallet-network:
    external: true
