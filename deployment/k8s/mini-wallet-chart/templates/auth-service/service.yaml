apiVersion: v1
kind: Service
metadata:
  name: wallet-auth-service
spec:
  type: ClusterIP
  selector:
    app: wallet-auth
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.auth.ports.service }}
      targetPort: {{ .Values.auth.ports.container }}
    - name: grpc
      protocol: TCP
      port: {{ .Values.auth.ports.grpc }}
      targetPort: grpc-port