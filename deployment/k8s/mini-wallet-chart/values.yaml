    pullPolicy: Always
  ports:
    container: 5002
    service: 5002

wallet:
  replicaCount: 2
  image:
    repository: docker.io/hossein1992/mini-wallet-wallet
    tag: latest
    pullPolicy: Always
  ports:
    container: 5002
    service: 5002
