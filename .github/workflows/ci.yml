name: Mini Wallet CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: hossein1992/mini-wallet
  SERVICES: "auth wallet docs notification"
  BASE_URL: "http://localhost:180"

jobs:
  # ================================
  # 1. HELM CHART LINTER & VALIDATION
  # ================================
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Lint Helm Chart
        run: |
          echo "☸️ Linting mini-wallet packaged chart structures..."
          helm lint deployment/k8s/mini-wallet-chart
  # ================================
  # 2. DETECT CHANGES & TEST
  # ================================
  pr-check:
    runs-on: ubuntu-latest
    needs: helm-lint
    outputs:
      changed_services: ${{ steps.list.outputs.changed_services }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            auth:
              - 'internal/auth/**'
              - 'deployment/auth/**'
              - 'cmd/auth/**'
              - 'pkg/**'
            wallet:
              - 'internal/wallet/**'
              - 'deployment/wallet/**'
              - 'cmd/wallet/**'
              - 'pkg/**'
            docs:
              - 'internal/docs/**'
              - 'deployment/docs/**'
              - 'cmd/docs/**'
              - 'pkg/**'
            notification:
              - 'internal/notification/**'
              - 'deployment/notification/**'
              - 'cmd/notification/**'
              - 'pkg/**'

      - name: Build changed services list
        id: list
        run: |
          SERVICES=""
          [ "${{ steps.changes.outputs.auth }}" == "true" ] && SERVICES="$SERVICES auth"
          [ "${{ steps.changes.outputs.wallet }}" == "true" ] && SERVICES="$SERVICES wallet"
          [ "${{ steps.changes.outputs.docs }}" == "true" ] && SERVICES="$SERVICES docs"
          [ "${{ steps.changes.outputs.notification }}" == "true" ] && SERVICES="$SERVICES notification"
          echo "changed_services=$SERVICES" >> $GITHUB_OUTPUT
          echo "📝 Changed services: $SERVICES"

      - name: Start infrastructure
        if: github.event_name == 'pull_request'
        run: |
          make ensure-env
          make check-network
          make start-infrastructure-stage

      - name: Start ALL services for testing
        if: github.event_name == 'pull_request'
        run: |
          echo "🚀 Starting all services for integration test..."
          for service in ${{ env.SERVICES }}; do
            echo "Starting $service..."
            make start-$service-stage
          done

      - name: Wait for services ready
        if: github.event_name == 'pull_request'
        run: sleep 60

      - name: Health check ALL services
        if: github.event_name == 'pull_request'
        run: |
          for service in ${{ env.SERVICES }}; do
            curl --fail ${{ env.BASE_URL }}/$service/live || exit 1
          done

      - name: Debug logs on failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          for service in ${{ env.SERVICES }}; do
            docker logs mini_wallet-$service --tail 50 || true
          done

      - name: Stop services
        if: always() && github.event_name == 'pull_request'
        run: |
          make stop-services-stage || true
          make stop-infrastructure-stage || true

  # ================================
  # 3. BUILD & PUSH
  # ================================
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: pr-check
    strategy:
      matrix:
        service: [auth, wallet, docs, notification]

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push ${{ matrix.service }}
        if: contains(needs.pr-check.outputs.changed_services, matrix.service)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployment/${{ matrix.service }}/stage/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:stage
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

      - name: Summary
        if: contains(needs.pr-check.outputs.changed_services, matrix.service)
        run: |
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Service pushed: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY